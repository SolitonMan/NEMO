{% extends 'base.html' %}
{% load static %}
{% block title %}Edit Requirement{% endblock %}
{% block extrahead %}
	{{ form.media }}
	<style>
		.ck-editor__editable {
			min-height: 300px;
		}
	</style>
{% endblock %}
{% block content %}
<h2>Edit Requirement</h2>
<form method="post">
	{% csrf_token %}
	<div class="form-group">
		<label for="id_name">Name</label>
		<input type="text" name="name" id="id_name" class="form-control" value="{{ requirement.name }}" required>
	</div>
	<div class="form-group">
		<label for="id_description">Description</label>
		<textarea name="description" id="id_description" class="form-control django_ckeditor_5">{% if requirement.description is not None %}{{ requirement.description }}{% endif %}</textarea>
	</div>
	<div class="form-group">
		<label for="id_resource_link">Resource Link</label>
		<input type="url" name="resource_link" id="id_resource_link" class="form-control" value="{{ requirement.resource_link }}">
	</div>
	<div class="form-group">
		<label for="id_resource_link_name">Resource Link Name</label>
		<input type="text" name="resource_link_name" id="id_resource_link_name" class="form-control" value="{{ requirement.resource_link_name }}">
	</div>
	<div class="form-group">
		<label for="id_prerequisites">Prerequisites</label>
		<textarea name="prerequisites" id="id_prerequisites" class="form-control" rows="3">{% if requirement.prerequisites is not None %}{{ requirement.prerequisites }}{% endif %}</textarea>
	</div>
	<div class="form-group">
		<label for="id_retrain_interval_days">Retrain Interval (days)</label>
		<input type="number" name="retrain_interval_days" id="id_retrain_interval_days" class="form-control" value="{{ requirement.retrain_interval_days }}">
	</div>
	<div class="form-group">
		<label for="id_expected_completion_time">Expected completion time (minutes)</label>
		<input type="number" name="expected_completion_time" id="id_expected_completion_time" class="form-control" value="{% if requirement.expected_completion_time %}{{ requirement.expected_completion_time }}{% endif %}">
	</div>
	<div class="form-group">
		<div class="checkbox">
			<label>
				<input type="checkbox" name="login_requirement_flag" id="id_login_requirement_flag" {% if requirement.login_requirement_flag %}checked{% endif %}>
				Requirement Assigned at First Login
			</label>
		</div>
	</div>
	<div class="form-group">
		<div class="checkbox">
			<label>
				<input type="checkbox" name="automated_update" id="id_automated_update" {% if requirement.automated_update %}checked{% endif %}>
				Automated Update
			</label>
		</div>
	</div>
	<div class="form-group">
		<div class="checkbox">
			<label>
				<input type="checkbox" name="autocompleted" id="id_autocompleted" {% if requirement.autocompleted %}checked{% endif %}>
				Autocompleted
			</label>
		</div>
	</div>
	<div class="form-group">
		<button type="submit" class="btn btn-primary">Save Requirement</button>
		<a href="{% url 'add_requirement' %}" class="btn btn-default">Cancel</a>
	</div>
</form>

<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
<script>
	document.addEventListener('DOMContentLoaded', function() {
		const editorElement = document.querySelector('#id_description');
		if (editorElement) {
			ClassicEditor
				.create(editorElement, {
					toolbar: {
						items: [
							'heading', '|',
							'bold', 'italic', 'link', 'bulletedList', 'numberedList', '|',
							'outdent', 'indent', '|',
							'blockQuote', 'insertTable', '|',
							'undo', 'redo'
						]
					},
					heading: {
						options: [
							{ model: 'paragraph', title: 'Paragraph', class: 'ck-heading_paragraph' },
							{ model: 'heading1', view: 'h1', title: 'Heading 1', class: 'ck-heading_heading1' },
							{ model: 'heading2', view: 'h2', title: 'Heading 2', class: 'ck-heading_heading2' },
							{ model: 'heading3', view: 'h3', title: 'Heading 3', class: 'ck-heading_heading3' }
						]
					},
					table: {
						contentToolbar: ['tableColumn', 'tableRow', 'mergeTableCells']
					}
				})
				.catch(error => {
					console.error('CKEditor initialization error:', error);
				});
		}
	});
</script>
{% endblock %}
